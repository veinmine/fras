id = "fras"
name = "Fire, Rust and Steam"
version = "0.1.0"
description = "A technology mod: shafts, gears and belts carry power from cranks, water wheels and steam engines to machines; boilers, governors, rust, and in 0.4 conveyor belts, elevators and machines that make the parts for better machines. Milestone 0.4 (factory)."
authors = ["veinmine"]
license = "GPL-3.0-or-later"
api = "0.2"
# Both: the networks run on the server (single player's too), the parts are
# drawn on the client.
side = "both"
capabilities = ["registries"]

# A native mod built against one exact game build: the newest Nightly when
# milestone 0.1 started (2026-11-22). FRAS uses the mod API's hooks only;
# [native] stays because the launcher builds native mods, and so the mod can
# take a mixin where no hook exists (none so far: docs/development.md).
[native]
game = "26.3"
horizon = "f1bb66f353cf67f2aa4665293fc75c8d91186fc7"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
