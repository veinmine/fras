[package]
name = "fras"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
authors = ["veinmine"]
description = "Fire, Rust and Steam, a native Horizon technology mod."

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod`
# command (the launcher builds against its own copy of the same build).
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
